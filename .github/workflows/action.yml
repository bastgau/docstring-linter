name: Action

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action_hook:
    runs-on: ubuntu-latest
    name: Docstring Linter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Git Checkout

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        name: Install Python ${{ vars.PYTHON_VERSION }}
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      - uses: bastgau/docstring-linter@main
        name: Execute Docstring Linter via GitHub Action
        with:
          paths: src/
          format: github-annotations

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install prek
        run: uv tool install prek

      - name: Execute Docstring Linter via Prek
        run: prek run --config .pre-commit-config-hook.yaml --all-files
